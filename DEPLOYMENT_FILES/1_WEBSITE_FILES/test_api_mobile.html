<!DOCTYPE html>
<html>

<head>
    <title>Test App Settings API</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Test App Settings API</h1>

    <button onclick="testAPI()">Test API Call</button>
    <button onclick="clearResult()">Clear</button>

    <div id="result"></div>

    <script>
        const API_URL = 'http://10.209.43.46/bizinote/backend/api';

        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Loading...</p>';

            try {
                const response = await fetch(`${API_URL}/get_app_settings.php`, {
                    method: 'GET',
                    headers: {
                        'Cache-Control': 'no-cache'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <h3 class="success">✅ Success!</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <h4>Settings:</h4>
                        <ul>
                            <li><strong>Email:</strong> ${data.settings.support_email}</li>
                            <li><strong>Phone:</strong> ${data.settings.support_phone}</li>
                            <li><strong>Version:</strong> ${data.settings.app_version}</li>
                        </ul>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3 class="error">❌ API returned error</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3 class="error">❌ Network Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>API URL:</strong> ${API_URL}/get_app_settings.php</p>
                    <p>Make sure XAMPP Apache is running!</p>
                `;
            }
        }

        function clearResult() {
            document.getElementById('result').innerHTML = '';
        }
    </script>
</body>

</html>
